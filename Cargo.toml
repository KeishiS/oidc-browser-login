[workspace]
members = [
    "crates/oidc-browser-login",
    "crates/oidc-browser-login-testkit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KeishiS/oidc-browser-login"
homepage = "https://github.com/KeishiS/oidc-browser-login"
publish = false

[workspace.dependencies]
base64 = "0.22.1"
jsonwebtoken = "9.3.1"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.19"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1.41"
url = "2.5.8"
wiremock = "0.6.5"
